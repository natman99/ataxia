[package]
name = "ataxia"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
ataxia_types = { workspace = true, features = ["schema", "serde"] }
iced = {version = "0.14.0", features = ["tokio"]}
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.53.1", features = ["full"] }

[lints.clippy]
pedantic = { level = "deny" }
nursery = { level = "deny" }
