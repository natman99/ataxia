[package]
name = "serenity_agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
rig-core = { version = "0.33.0", features = ["derive"] }
rig-derive = "0.1.11"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
serenity_types = { path = "../serenity_types" }
futures = "0.3.32"
parking_lot = { version = "0.12.5", features = ["serde"] }
rig-qdrant = "0.2.2"
qdrant-client = {version = "1.17.0", features = ["serde"] }
rustls = { version = "0.23.37" }
text-splitter = { version = "0.29.3", features = ["markdown", "tiktoken-rs"] }
log = "0.4.29"
env_logger = "0.11.10"
dotenvy = "0.15.7"
tiktoken-rs = "0.9.1"
sha2 = "0.10.9"
uuid = { version = "1.22.0", features = ["v5"] }
glob = "0.3.3"
