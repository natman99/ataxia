[workspace]
members = [
    "ataxia",
    "ataxia_cli",
    "ataxia_scripting",
    "ataxia_types",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.102"
ataxia_types = { path = "ataxia_types" }
ataxia_scripting = { path = "ataxia_scripting" }
clap = { version = "4.6.1", features = ["derive"] }
rhai = { version = "1.25.1" }
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
log = "0.4.33"
