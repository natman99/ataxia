[package]
name = "serenity_ui"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["lazy" ] }
log = "0.4.29"
parking_lot = "0.12.5"
rfd = "0.17.2"
serde = "1.0.228"
serde_json = "1.0.149"
serenity_types = { path = "../serenity_types" }
serenity_agent = { path = "../serenity_agent" }
anyhow = "1.0.102"
rig-core = "0.33.0"
pollster = "0.4.0"
dotenvy = "0.15.7"
env_logger = "0.11.10"


# rustls = { version = "0.23.37" }

[features]
debug = ["iced/hot"]


[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
